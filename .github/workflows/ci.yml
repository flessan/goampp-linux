name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      # The Fyne GUI is cgo.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Reads the `go` directive from go.mod, so the toolchain is never
          # pinned in two places.
          go-version-file: go.mod
          cache: true

      # Use the image's MinGW-w64 gcc, installing it when the image has none.
      - name: Set up gcc
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1
